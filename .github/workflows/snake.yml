name: Update contribution snake

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#c9ece9,#90d7d2,#58bdb8,#259c95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e3d49,#125e6b,#1c8991,#39c5bb

      - name: Publish animations to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          gh auth setup-git --hostname github.com
          git init --initial-branch=output dist
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add -- github-snake.svg github-snake-dark.svg
          git -C dist commit --message "Update contribution snake"
          git -C dist push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/output
